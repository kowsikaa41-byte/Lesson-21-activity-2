<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
    <html>
    
    <body>
    
        <p>A function can access variables defined inside the function:</p>
    
        <button type="button" onclick="myFunction()">Click Me!</button>
    
        
        <p id="demo"></p>
        <p id="demo1"></p>
        <p id="demo2"></p>
    
        <script>
            
            let b = 5;

            
            document.getElementById("demo2").innerHTML = "Global variable b: " + b;

            function myFunction() {
                
                let a = 4;

                
                document.getElementById("demo").innerHTML = "Result of b * a: " + (b * a);
            }

    
        </script>
    
    </body>
    
    </html>

    
</body>
</html>
